workflows:
  flutter-modular-workflow:
    name: Flutter Modular CI/CD
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies for all modules
        script: |
          flutter pub get
          MODULES=("core" "db" "about" "movie" "tv" "watchlist")
          for module in "${MODULES[@]}"; do
            echo "Pub get in: modules/$module"
            cd "modules/$module"
            flutter pub get
            cd ../..
          done
      - name: Run all tests (Unit & Integration)
        script: |
          # Start iOS Simulator or Android Emulator if needed for Integration Test
          # Untuk macOS instance, kita bisa pakai iOS simulator
          xcrun simctl list devices
          ID=$(xcrun simctl list devices | grep -E 'iPhone|iPad' | grep -v 'unavailable' | head -1 | awk -F '[()]' '{print $2}')
          if [ -z "$ID" ]; then
            echo "No simulator found"
          else
            xcrun simctl boot $ID || true
          fi
          
          chmod +x run_tests.sh
          ./run_tests.sh
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - sedika.email@gmail.com
        notify:
          success: true
          failure: true
